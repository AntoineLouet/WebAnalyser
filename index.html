<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WebAnalyser — Nobook</title>
<style>
  /* Layout concept : une page de suivi — bandeau de filtres fixe, onglets par
     site, une carte de tendance par période en barres groupées (vues / visiteurs),
     deux tableaux de détail (pages, référents). */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-views: #2a78d6;
    --series-visitors: #eb6834;
    --site-1: #2a78d6;
    --site-2: #eb6834;
    --site-3: #1baf7a;
    --good: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-views: #3987e5;
      --series-visitors: #d95926;
      --site-1: #3987e5;
      --site-2: #d95926;
      --site-3: #199e70;
      --good: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-views: #3987e5;
    --series-visitors: #d95926;
    --site-1: #3987e5;
    --site-2: #d95926;
    --site-3: #199e70;
    --good: #0ca30c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px;
    padding-block: 20px 48px;
    max-width: 1000px;
    margin-inline: auto;
  }

  h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 2px; text-wrap: balance; }
  .soustitre { color: var(--ink-2); font-size: 0.88rem; margin: 0 0 20px; }

  .barre-filtres {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .plage {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px;
  }
  .plage button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .plage button:hover { background: var(--border); }
  .plage button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--page);
  }
  .maj { margin-left: auto; color: var(--ink-muted); font-size: 0.78rem; }

  .onglets {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--grid);
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .onglets button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 14px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .onglets button[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--ink);
    font-weight: 650;
  }

  .tuiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .tuile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .tuile .etiquette {
    color: var(--ink-2);
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tuile .etiquette .puce {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  .tuile .valeur {
    font-size: 1.8rem;
    font-weight: 650;
    margin-top: 2px;
  }

  .carte {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .carte h2 {
    font-size: 0.92rem;
    font-weight: 650;
    margin: 0 0 2px;
  }
  .carte .legende {
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
  }
  .legende .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-2);
  }
  .legende .trait {
    width: 10px; height: 10px; border-radius: 3px; flex: none;
  }

  .zone-graphique { position: relative; overflow-x: auto; }
  svg.graphique { display: block; min-width: 100%; }
  .bulle {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 0.76rem;
    padding: 6px 9px;
    border-radius: 8px;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .bulle strong { font-variant-numeric: tabular-nums; }
  .bulle .ligne { display: flex; align-items: center; gap: 5px; }
  .bulle .cle { width: 7px; height: 7px; border-radius: 2px; flex: none; }

  .vide {
    color: var(--ink-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 30px 10px;
  }

  table.donnees {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.donnees th {
    text-align: left;
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 0.76rem;
    padding: 0 8px 6px 0;
    border-bottom: 1px solid var(--grid);
  }
  table.donnees td {
    padding: 7px 8px 7px 0;
    border-bottom: 1px solid var(--grid);
    color: var(--ink);
  }
  table.donnees tr:last-child td { border-bottom: none; }
  table.donnees td.chemin {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  table.donnees td.nombre {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    width: 70px;
  }

  .deux-colonnes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .deux-colonnes { grid-template-columns: 1fr; }
  }

  .apercu-site {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--grid);
  }
  .apercu-site:last-child { border-bottom: none; }
  .apercu-site .nom {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 0.9rem;
  }
  .apercu-site .nom .puce { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .apercu-site .chiffre {
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-size: 0.9rem;
  }
  .apercu-site .chiffre .petit {
    display: block;
    font-size: 0.7rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
</style>
</head>
<body>

<h1>WebAnalyser</h1>
<p class="soustitre">Vues et visiteurs uniques de tes sites, en direct depuis le projet Supabase Nobook.</p>

<div class="barre-filtres">
  <div class="plage" role="group" aria-label="Période">
    <button data-jours="7">7 jours</button>
    <button data-jours="30" aria-pressed="true">30 jours</button>
    <button data-jours="90">90 jours</button>
  </div>
  <span class="maj" id="maj"></span>
</div>

<div class="onglets" id="onglets" role="tablist"></div>
<div id="contenu"></div>
<div class="bulle" id="bulle"></div>

<script>
(function () {
  var FONCTION = "https://pjudywzdrixhddemhhub.supabase.co/functions/v1/stats";
  var NOMS = { "riad-sasha": "Riad Sasha", "riadsoulmate": "Riad Soulmate", "chezmamiejo": "Chez Mamie Jo" };
  var ORDRE_COULEURS = ["riad-sasha", "chezmamiejo", "riadsoulmate"];

  var etat = { jours: 30, donnees: null, ongletActif: "tous" };

  function couleurSite(siteId) {
    var i = ORDRE_COULEURS.indexOf(siteId);
    if (i === -1) i = (ORDRE_COULEURS.length + Math.abs(hash(siteId)) % 5);
    var slots = ["--site-1", "--site-2", "--site-3"];
    return "var(" + (slots[i] || "--site-1") + ")";
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i);
    return h;
  }
  function nomSite(id) { return NOMS[id] || id; }

  function formatNombre(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
  }
  function formatJour(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  async function charger() {
    try {
      var r = await fetch(FONCTION + "?days=" + etat.jours);
      var json = await r.json();
      etat.donnees = json;
    } catch (e) {
      etat.donnees = { erreur: true };
    }
    construireOnglets();
    rendre();
  }

  function listeSites() {
    if (!etat.donnees || !etat.donnees.sites) return [];
    return Object.keys(etat.donnees.sites).sort(function (a, b) {
      return etat.donnees.sites[b].views - etat.donnees.sites[a].views;
    });
  }

  function construireOnglets() {
    var conteneur = document.getElementById("onglets");
    conteneur.textContent = "";
    var sites = listeSites();

    var btnTous = document.createElement("button");
    btnTous.textContent = "Tous les sites";
    btnTous.setAttribute("role", "tab");
    btnTous.setAttribute("aria-selected", String(etat.ongletActif === "tous"));
    btnTous.addEventListener("click", function () { etat.ongletActif = "tous"; rendre(); });
    conteneur.appendChild(btnTous);

    sites.forEach(function (id) {
      var b = document.createElement("button");
      b.textContent = nomSite(id);
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(etat.ongletActif === id));
      b.addEventListener("click", function () { etat.ongletActif = id; rendre(); });
      conteneur.appendChild(b);
    });

    Array.prototype.forEach.call(conteneur.children, function (b) {
      b.setAttribute("aria-selected", String(
        (b.textContent === "Tous les sites" && etat.ongletActif === "tous") ||
        b.textContent === nomSite(etat.ongletActif)
      ));
    });
  }

  function rendre() {
    var contenu = document.getElementById("contenu");
    var majEl = document.getElementById("maj");
    contenu.textContent = "";

    if (!etat.donnees || etat.donnees.erreur) {
      var p = document.createElement("p");
      p.className = "vide";
      p.textContent = "Impossible de charger les statistiques pour le moment.";
      contenu.appendChild(p);
      return;
    }

    if (etat.donnees.generated_at) {
      var d = new Date(etat.donnees.generated_at);
      majEl.textContent = "Mis à jour à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    if (etat.ongletActif === "tous") {
      rendreApercuGlobal(contenu);
    } else {
      rendreSite(contenu, etat.ongletActif);
    }
  }

  function totalSites() {
    var sites = etat.donnees.sites || {};
    var v = 0, u = 0;
    Object.keys(sites).forEach(function (id) { v += sites[id].views; u += sites[id].visitors; });
    return { views: v, visitors: u };
  }

  function rendreApercuGlobal(contenu) {
    var sites = listeSites();
    var totaux = totalSites();

    var tuiles = document.createElement("div");
    tuiles.className = "tuiles";
    tuiles.appendChild(tuile("Vues totales", totaux.views, "var(--series-views)"));
    tuiles.appendChild(tuile("Visiteurs uniques", totaux.visitors, "var(--series-visitors)"));
    contenu.appendChild(tuiles);

    var carte = document.createElement("div");
    carte.className = "carte";
    var h2 = document.createElement("h2");
    h2.textContent = "Par site";
    carte.appendChild(h2);

    if (sites.length === 0) {
      carte.appendChild(elementVide("Pas encore de visite enregistrée sur cette période."));
    } else {
      sites.forEach(function (id) {
        var s = etat.donnees.sites[id];
        var ligne = document.createElement("div");
        ligne.className = "apercu-site";

        var nom = document.createElement("div");
        nom.className = "nom";
        var puce = document.createElement("span");
        puce.className = "puce";
        puce.style.background = couleurSite(id);
        nom.appendChild(puce);
        var texteNom = document.createElement("span");
        texteNom.textContent = nomSite(id);
        nom.appendChild(texteNom);
        ligne.appendChild(nom);

        var vues = document.createElement("div");
        vues.className = "chiffre";
        var vVal = document.createElement("span"); vVal.textContent = formatNombre(s.views);
        var vLbl = document.createElement("span"); vLbl.className = "petit"; vLbl.textContent = "vues";
        vues.appendChild(vVal); vues.appendChild(vLbl);
        ligne.appendChild(vues);

        var visiteurs = document.createElement("div");
        visiteurs.className = "chiffre";
        var uVal = document.createElement("span"); uVal.textContent = formatNombre(s.visitors);
        var uLbl = document.createElement("span"); uLbl.className = "petit"; uLbl.textContent = "visiteurs";
        visiteurs.appendChild(uVal); visiteurs.appendChild(uLbl);
        ligne.appendChild(visiteurs);

        carte.appendChild(ligne);
      });
    }
    contenu.appendChild(carte);
  }

  function rendreSite(contenu, id) {
    var s = etat.donnees.sites[id];
    if (!s) {
      contenu.appendChild(elementVide("Pas encore de visite enregistrée pour " + nomSite(id) + " sur cette période."));
      return;
    }

    var tuiles = document.createElement("div");
    tuiles.className = "tuiles";
    tuiles.appendChild(tuile("Vues", s.views, "var(--series-views)"));
    tuiles.appendChild(tuile("Visiteurs uniques", s.visitors, "var(--series-visitors)"));
    contenu.appendChild(tuiles);

    var carteGraph = document.createElement("div");
    carteGraph.className = "carte";
    var h2g = document.createElement("h2"); h2g.textContent = "Tendance";
    var legende = document.createElement("div");
    legende.className = "legende";
    var item1 = document.createElement("span"); item1.className = "item";
    var trait1 = document.createElement("span"); trait1.className = "trait"; trait1.style.background = "var(--series-views)";
    item1.appendChild(trait1); item1.appendChild(document.createTextNode("Vues"));
    var item2 = document.createElement("span"); item2.className = "item";
    var trait2 = document.createElement("span"); trait2.className = "trait"; trait2.style.background = "var(--series-visitors)";
    item2.appendChild(trait2); item2.appendChild(document.createTextNode("Visiteurs uniques"));
    legende.appendChild(item1); legende.appendChild(item2);
    var zoneGraph = document.createElement("div");
    zoneGraph.className = "zone-graphique";
    carteGraph.appendChild(h2g);
    carteGraph.appendChild(legende);
    carteGraph.appendChild(zoneGraph);
    contenu.appendChild(carteGraph);
    dessinerBarres(zoneGraph, s.by_day);

    var colonnes = document.createElement("div");
    colonnes.className = "deux-colonnes";

    var cartePages = document.createElement("div");
    cartePages.className = "carte";
    var h2p = document.createElement("h2"); h2p.textContent = "Pages les plus vues";
    cartePages.appendChild(h2p);
    cartePages.appendChild(tableauDonnees(s.top_pages, "path", "Page"));
    colonnes.appendChild(cartePages);

    var carteRef = document.createElement("div");
    carteRef.className = "carte";
    var h2r = document.createElement("h2"); h2r.textContent = "Référents";
    carteRef.appendChild(h2r);
    carteRef.appendChild(tableauDonnees(s.top_referrers, "referrer", "Source"));
    colonnes.appendChild(carteRef);

    contenu.appendChild(colonnes);
  }

  function tuile(label, valeur, couleur) {
    var d = document.createElement("div");
    d.className = "tuile";
    var e = document.createElement("div");
    e.className = "etiquette";
    var puce = document.createElement("span");
    puce.className = "puce";
    puce.style.background = couleur;
    e.appendChild(puce);
    var texte = document.createElement("span");
    texte.textContent = label;
    e.appendChild(texte);
    d.appendChild(e);
    var v = document.createElement("div");
    v.className = "valeur";
    v.textContent = formatNombre(valeur);
    d.appendChild(v);
    return d;
  }

  function elementVide(texte) {
    var p = document.createElement("p");
    p.className = "vide";
    p.textContent = texte;
    return p;
  }

  function tableauDonnees(lignes, cle, entete) {
    if (!lignes || lignes.length === 0) {
      return elementVide("Rien à afficher pour l'instant.");
    }
    var table = document.createElement("table");
    table.className = "donnees";
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    var thNom = document.createElement("th"); thNom.textContent = entete;
    var thVal = document.createElement("th"); thVal.textContent = "Vues"; thVal.style.textAlign = "right";
    trh.appendChild(thNom); trh.appendChild(thVal);
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    lignes.forEach(function (ligne) {
      var tr = document.createElement("tr");
      var tdNom = document.createElement("td");
      tdNom.className = "chemin";
      tdNom.textContent = ligne[cle] || "/";
      tdNom.title = ligne[cle] || "";
      var tdVal = document.createElement("td");
      tdVal.className = "nombre";
      tdVal.textContent = formatNombre(ligne.views);
      tr.appendChild(tdNom); tr.appendChild(tdVal);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function dessinerBarres(conteneur, jours) {
    conteneur.textContent = "";
    if (!jours || jours.length === 0) {
      conteneur.appendChild(elementVide("Pas encore assez de données pour tracer une tendance."));
      return;
    }

    var largeurJour = 56;
    var largeur = Math.max(320, jours.length * largeurJour);
    var hauteur = 180;
    var marge = { haut: 10, bas: 24, gauche: 4, droite: 4 };
    var zoneH = hauteur - marge.haut - marge.bas;
    var maxVal = 1;
    jours.forEach(function (j) { maxVal = Math.max(maxVal, j.views); });
    var echelle = Math.pow(10, Math.floor(Math.log10(maxVal)));
    var maxAxe = Math.ceil(maxVal / echelle) * echelle;
    if (maxAxe < maxVal) maxAxe += echelle;
    if (maxAxe === 0) maxAxe = 1;

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "graphique");
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    svg.setAttribute("width", largeur);
    svg.setAttribute("height", hauteur);

    [0, 0.5, 1].forEach(function (f) {
      var y = marge.haut + zoneH * (1 - f);
      var ligne = document.createElementNS("http://www.w3.org/2000/svg", "line");
      ligne.setAttribute("x1", marge.gauche);
      ligne.setAttribute("x2", largeur - marge.droite);
      ligne.setAttribute("y1", y);
      ligne.setAttribute("y2", y);
      ligne.setAttribute("stroke", "var(--grid)");
      ligne.setAttribute("stroke-width", "1");
      svg.appendChild(ligne);
    });

    var bulle = document.getElementById("bulle");

    jours.forEach(function (j, i) {
      var cx = i * largeurJour + largeurJour / 2;
      var largeurBarre = 14;
      var ecart = 3;

      var hV = (j.views / maxAxe) * zoneH;
      var hU = (j.visitors / maxAxe) * zoneH;

      var groupe = document.createElementNS("http://www.w3.org/2000/svg", "g");

      var barreVues = barreRect(cx - largeurBarre - ecart / 2, marge.haut + zoneH - hV, largeurBarre, hV, "var(--series-views)");
      var barreVisiteurs = barreRect(cx + ecart / 2, marge.haut + zoneH - hU, largeurBarre, hU, "var(--series-visitors)");
      groupe.appendChild(barreVues);
      groupe.appendChild(barreVisiteurs);

      var zoneSurvol = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      zoneSurvol.setAttribute("x", cx - largeurJour / 2);
      zoneSurvol.setAttribute("y", marge.haut);
      zoneSurvol.setAttribute("width", largeurJour);
      zoneSurvol.setAttribute("height", zoneH);
      zoneSurvol.setAttribute("fill", "transparent");
      zoneSurvol.style.cursor = "pointer";

      function montrer() {
        bulle.textContent = "";
        var titre = document.createElement("div");
        titre.style.marginBottom = "4px";
        titre.style.opacity = "0.75";
        titre.textContent = formatJour(j.day);
        bulle.appendChild(titre);
        [["Vues", j.views, "var(--series-views)"], ["Visiteurs", j.visitors, "var(--series-visitors)"]].forEach(function (row) {
          var l = document.createElement("div");
          l.className = "ligne";
          var cle = document.createElement("span");
          cle.className = "cle";
          cle.style.background = row[2];
          l.appendChild(cle);
          var txt = document.createElement("span");
          txt.textContent = row[0] + " ";
          var strong = document.createElement("strong");
          strong.textContent = row[1];
          l.appendChild(txt);
          l.appendChild(strong);
          bulle.appendChild(l);
        });
        var rectConteneur = conteneur.getBoundingClientRect();
        var rectSvg = svg.getBoundingClientRect();
        bulle.style.left = (rectSvg.left - rectConteneur.left + (cx / largeur) * rectSvg.width) + "px";
        bulle.style.top = (marge.haut - 6) + "px";
        bulle.style.opacity = "1";
      }
      function cacher() { bulle.style.opacity = "0"; }

      zoneSurvol.addEventListener("pointerenter", montrer);
      zoneSurvol.addEventListener("pointermove", montrer);
      zoneSurvol.addEventListener("pointerleave", cacher);
      groupe.appendChild(zoneSurvol);

      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", cx);
      label.setAttribute("y", hauteur - 6);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("font-size", "10");
      label.setAttribute("fill", "var(--ink-muted)");
      label.textContent = formatJour(j.day);
      groupe.appendChild(label);

      svg.appendChild(groupe);
    });

    conteneur.style.position = "relative";
    conteneur.appendChild(svg);
  }

  function barreRect(x, y, w, h, couleur) {
    var r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", x);
    r.setAttribute("y", y);
    r.setAttribute("width", w);
    r.setAttribute("height", Math.max(h, 0));
    r.setAttribute("rx", "3");
    r.setAttribute("fill", couleur);
    return r;
  }

  document.querySelectorAll(".plage button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".plage button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      etat.jours = Number(b.dataset.jours);
      charger();
    });
  });

  charger();
  setInterval(charger, 60000);
})();
</script>
</body>
</html>
