<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WebAnalyser — Nobook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Helvetica,Arial,sans-serif' font-weight='600' font-size='32' fill='%23ffffff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #e8e8ed;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-muted: #86868b;
    --grid: #e8e8ed;
    --line: rgba(60,60,67,0.12);
    --line-strong: rgba(60,60,67,0.29);
    --series-visitors: #0071e3;
    --series-views: #b9dcfb;
    --series-duree: #5e5ce6;
    --series-resa: #ff9500;
    --good-bg: #34c759;
    --good-fg: #ffffff;
    --bad-bg: #ff3b30;
    --bad-fg: #ffffff;
    --topbar-bg: rgba(242,242,247,0.82);
    --segment-shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 1px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-muted: #6e6e73;
      --grid: #2c2c2e;
      --line: rgba(255,255,255,0.145);
      --line-strong: rgba(255,255,255,0.28);
      --series-visitors: #2997ff;
      --series-views: #1b4160;
      --series-duree: #7d7aff;
      --series-resa: #ff9f0a;
      --good-bg: #30d158;
      --good-fg: #000000;
      --bad-bg: #ff453a;
      --bad-fg: #000000;
      --topbar-bg: rgba(0,0,0,0.78);
      --segment-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --ink: #f5f5f7;
    --ink-2: #a1a1a6;
    --ink-muted: #6e6e73;
    --grid: #2c2c2e;
    --line: rgba(255,255,255,0.145);
    --line-strong: rgba(255,255,255,0.28);
    --series-visitors: #2997ff;
    --series-views: #1b4160;
    --series-duree: #7d7aff;
    --series-resa: #ff9f0a;
    --good-bg: #30d158;
    --good-fg: #000000;
    --bad-bg: #ff453a;
    --bad-fg: #000000;
    --topbar-bg: rgba(0,0,0,0.78);
    --segment-shadow: 0 1px 3px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-inline: 18px;
    padding-block: 0 56px;
    max-width: 720px;
    margin-inline: auto;
  }

  .entete {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin: 0 -18px 20px;
    padding: 18px 18px 14px;
    background: var(--topbar-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--line);
  }
  h1 {
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: -0.022em;
    margin: 0;
    text-wrap: balance;
  }
  .soustitre { color: var(--ink-2); font-size: 0.85rem; margin: 3px 0 0; letter-spacing: -0.006em; }

  .plage {
    display: flex;
    gap: 2px;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    flex: none;
  }
  .plage button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .plage button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: var(--segment-shadow);
  }

  .retour {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--series-visitors);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 500;
    padding: 0;
    margin-bottom: 18px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .retour:hover { opacity: 0.7; }
  .retour svg { flex: none; }

  .maj { color: var(--ink-muted); font-size: 0.75rem; margin: -2px 0 18px; }

  /* Accueil : liste groupée des sites, façon réglages iOS */
  .liste-sites {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .ligne-site {
    appearance: none;
    border: none;
    background: transparent;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    border-bottom: 1px solid var(--line);
    color: inherit;
    transition: background 0.1s;
  }
  .liste-sites .ligne-site:last-child { border-bottom: none; }
  .ligne-site:hover, .ligne-site:active { background: var(--surface-2); }
  .ligne-site img {
    width: 38px; height: 38px; border-radius: 9px;
    object-fit: cover;
    background: var(--surface-2);
    flex: none;
  }
  .ligne-site .infos-site { min-width: 0; flex: 1; }
  .ligne-site .nom-site {
    font-weight: 600;
    font-size: 1.02rem;
    letter-spacing: -0.012em;
  }
  .ligne-site .domaine-site {
    color: var(--ink-muted);
    font-size: 0.78rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 1px;
  }
  .ligne-site .spark-bloc {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    flex: none;
  }
  .ligne-site .spark-chiffre {
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .ligne-site .spark-label {
    font-size: 0.68rem;
    color: var(--ink-muted);
  }
  .ligne-site .chevron {
    color: var(--ink-muted);
    flex: none;
  }
  @media (max-width: 420px) {
    .ligne-site .spark-bloc svg { display: none; }
  }

  /* Page détail d'un site */
  .entete-site {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 20px;
  }
  .entete-site img {
    width: 46px; height: 46px; border-radius: 11px;
    object-fit: cover;
    background: var(--surface-2);
    flex: none;
  }
  .entete-site .nom-site {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.018em;
  }
  .entete-site .lien-site {
    color: var(--series-visitors);
    font-size: 0.82rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .entete-site .lien-site:hover { opacity: 0.7; }
  .entete-site .lien-site svg { flex: none; }

  .tuiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    margin-bottom: 18px;
    background: var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .tuile {
    background: var(--surface);
    padding: 16px 18px;
  }
  .tuile .etiquette {
    color: var(--ink-2);
    font-size: 0.79rem;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tuile .etiquette .puce {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  .tuile .valeur {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .pastille {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.74rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    border-radius: 999px;
    margin-top: 9px;
  }
  .pastille.hausse { background: var(--good-bg); color: var(--good-fg); }
  .pastille.baisse { background: var(--bad-bg); color: var(--bad-fg); }
  .pastille svg { flex: none; }

  .carte {
    background: var(--surface);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .carte h2 {
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: -0.008em;
    margin: 0 0 3px;
  }
  .carte .legende {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .legende .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-2);
  }
  .legende .trait-legende {
    width: 13px; height: 2px; border-radius: 2px; flex: none;
  }

  .zone-graphique { position: relative; overflow-x: auto; }
  svg.graphique { display: block; min-width: 100%; }
  .bulle {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 0.76rem;
    padding: 9px 11px;
    border-radius: 11px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .bulle .titre-bulle { margin-bottom: 5px; opacity: 0.65; }
  .bulle strong { font-variant-numeric: tabular-nums; }
  .bulle .ligne { display: flex; align-items: center; gap: 7px; }
  .bulle .cle { width: 10px; height: 2px; border-radius: 2px; flex: none; }

  .vide {
    color: var(--ink-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 40px 10px;
  }

  .onglets-souscarte {
    display: flex;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .onglets-souscarte button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0 0 9px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .onglets-souscarte button[aria-selected="true"] {
    color: var(--series-visitors);
    border-bottom-color: var(--series-visitors);
    font-weight: 600;
  }

  table.donnees {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  table.donnees th {
    text-align: left;
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 0.75rem;
    padding: 0 8px 7px 0;
    border-bottom: 1px solid var(--line);
  }
  table.donnees td {
    padding: 9px 8px 9px 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  table.donnees tr:last-child td { border-bottom: none; }
  table.donnees td.chemin {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ligne-referent {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }
  .ligne-referent img {
    width: 15px; height: 15px; border-radius: 3px;
    flex: none;
    background: var(--page);
  }
  .ligne-referent span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  table.donnees td.chiffres {
    text-align: right;
    width: 90px;
  }
  table.donnees .nombre {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  table.donnees .pourcentage {
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    font-size: 0.76rem;
    margin-left: 7px;
  }

  .deux-colonnes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 640px) {
    .deux-colonnes { grid-template-columns: 1fr; }
  }

  ::selection { background: var(--series-views); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--series-visitors); outline-offset: 2px; }
</style>
</head>
<body>

<div class="entete">
  <div>
    <h1 id="titre">WebAnalyser</h1>
    <p class="soustitre" id="soustitre">Vues et visiteurs uniques de tes sites, en direct depuis le projet Supabase Nobook.</p>
  </div>
  <div class="plage" id="plage" role="group" aria-label="Période" style="display:none">
    <button data-mode="heures" data-valeur="24">24 h</button>
    <button data-mode="jours" data-valeur="7">7 j</button>
    <button data-mode="jours" data-valeur="30" aria-pressed="true">30 j</button>
    <button data-mode="jours" data-valeur="90">90 j</button>
  </div>
</div>

<p class="maj" id="maj"></p>
<div id="contenu"></div>
<div class="bulle" id="bulle"></div>

<script>
(function () {
  var FONCTION = "https://pjudywzdrixhddemhhub.supabase.co/functions/v1/stats";
  var SITES = {
    "riad-sasha":   { nom: "Riad Sasha",    domaine: "riadsasha.com",               logo: "assets/logos/riad-sasha.png",
                       reservationsApi: "https://xpezxeziaykyxowocyrk.supabase.co/functions/v1/riad-booking-count" },
    "riadsoulmate": { nom: "Riad Soulmate", domaine: null,                          logo: "assets/logos/riadsoulmate.svg",
                       reservationsApi: null }, // widget encore en mode démo, pas de base derrière
    "chezmamiejo":  { nom: "Chez Mamie Jo", domaine: "chezmamiejo-loudenvielle.fr", logo: "assets/logos/chezmamiejo.png",
                       reservationsApi: null }  // restaurant : pas de réservations "en direct" au même sens
  };
  var ORDRE = ["riad-sasha", "chezmamiejo", "riadsoulmate"];

  var ICONE_EXTERNE = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 3h6.5v6.5M13 3 6 10M4 5H3v8h8v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICONE_CHEVRON = '<svg width="8" height="13" viewBox="0 0 8 13" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1l5.5 5.5L1 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICONE_RETOUR = '<svg width="9" height="14" viewBox="0 0 9 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1 1.5 7 8 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICONE_HAUSSE = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7.5 7.5 2M7.5 2H3.5M7.5 2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICONE_BAISSE = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2.5 7.5 8M7.5 8H3.5M7.5 8V4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var etat = {
    vue: "liste",              // "liste" | "site"
    mode: "jours", valeur: 30,
    actuel: null, precedent: null,
    septJours: null,
    reservations: {},          // site_id -> nombre de demandes sur etat.joursResa, ou null si indisponible
    joursResa: 30,
    ongletActif: null, sousOnglet: "pages"
  };

  function infoSite(id) { return SITES[id] || { nom: id, domaine: null, logo: null }; }

  var formateurPays = (typeof Intl !== "undefined" && Intl.DisplayNames)
    ? new Intl.DisplayNames(["fr"], { type: "region" })
    : null;
  function nomPays(code) {
    if (!code) return code;
    try {
      return (formateurPays && formateurPays.of(code.toUpperCase())) || code;
    } catch (e) {
      return code;
    }
  }
  function drapeauPays(code) {
    if (!code || code.length !== 2) return "🌐";
    var points = code.toUpperCase().split("").map(function (c) {
      return 127397 + c.charCodeAt(0);
    });
    return String.fromCodePoint.apply(null, points);
  }

  function formatNombre(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
  }
  function formatDuree(secondes) {
    if (secondes === null || secondes === undefined) return "—";
    secondes = Math.max(0, Math.round(secondes));
    var h = Math.floor(secondes / 3600);
    var m = Math.floor((secondes % 3600) / 60);
    var s = secondes % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return m + ":" + String(s).padStart(2, "0");
  }
  function cleTemps(entree) { return entree.day || entree.hour; }
  function etiquetteTemps(iso) {
    var d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
    if (etat.mode === "heures") {
      return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  async function charger() {
    try {
      var qA, qB;
      if (etat.mode === "heures") {
        qA = "?hours=" + etat.valeur;
        qB = "?hours=" + (etat.valeur * 2);
      } else {
        qA = "?days=" + etat.valeur;
        qB = "?days=" + (etat.valeur * 2);
      }
      // Les réservations suivent la même période que le reste : en mode
      // heures (24h), ça reste exprimé en jours (24h = 1 j), l'API ne
      // connaissant que des jours.
      etat.joursResa = etat.mode === "heures" ? Math.max(1, Math.round(etat.valeur / 24)) : etat.valeur;

      var [r1, r2, r3] = await Promise.all([
        fetch(FONCTION + qA),
        fetch(FONCTION + qB),
        fetch(FONCTION + "?days=7")
      ]);
      var actuel = await r1.json();
      var double = await r2.json();
      etat.septJours = await r3.json();
      etat.actuel = actuel;
      var precedent = { sites: {} };
      Object.keys(double.sites || {}).forEach(function (id) {
        var tot = double.sites[id];
        var cur = (actuel.sites && actuel.sites[id]) || { views: 0, visitors: 0 };
        precedent.sites[id] = {
          views: Math.max(0, tot.views - cur.views),
          visitors: Math.max(0, tot.visitors - cur.visitors)
        };
      });
      etat.precedent = precedent;

      var idsResa = Object.keys(SITES).filter(function (id) { return SITES[id].reservationsApi; });
      await Promise.all(idsResa.map(function (id) {
        var url = SITES[id].reservationsApi + "?days=" + etat.joursResa;
        return fetch(url)
          .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
          .then(function (data) {
            etat.reservations[id] = (typeof data.count === "number") ? data.count : null;
          })
          .catch(function () {
            etat.reservations[id] = null;
          });
      }));
    } catch (e) {
      etat.actuel = { erreur: true };
    }
    rendre();
  }

  function listeSites() {
    var base = ORDRE.slice();
    if (etat.septJours && etat.septJours.sites) {
      Object.keys(etat.septJours.sites).forEach(function (id) {
        if (base.indexOf(id) === -1) base.push(id);
      });
    }
    return base.sort(function (a, b) {
      var sites = (etat.septJours && etat.septJours.sites) || {};
      var va = (sites[a] && sites[a].views) || 0;
      var vb = (sites[b] && sites[b].views) || 0;
      return vb - va;
    });
  }

  function allerALaListe() {
    etat.vue = "liste";
    etat.ongletActif = null;
    rendre();
  }
  function ouvrirSite(id) {
    etat.vue = "site";
    etat.ongletActif = id;
    rendre();
  }

  function rendre() {
    var contenu = document.getElementById("contenu");
    var majEl = document.getElementById("maj");
    var plageEl = document.getElementById("plage");

  function pastilleTendance(actuelV, precedentV) {

    var variation = ((actuelV - precedentV) / precedentV) * 100;

    p.className = "pastille " + (hausse ? "hausse" : "baisse");
    var icone = document.createElement("span");
    icone.innerHTML = hausse ? ICONE_HAUSSE : ICONE_BAISSE;

    p.appendChild(document.createTextNode(Math.abs(Math.round(variation)) + "%"));
    return p;
  }

  function dessinerSparkline(jours, couleur) {
    var largeur = 72, hauteur = 28;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", largeur);
    svg.setAttribute("height", hauteur);
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    if (!jours || jours.length < 2) return svg;
    var max = 1;
    jours.forEach(function (j) { max = Math.max(max, j.views); });
    var n = jours.length;
    var pts = jours.map(function (j, i) {
      var x = (i / (n - 1)) * (largeur - 4) + 2;
      var y = hauteur - 3 - (j.views / max) * (hauteur - 6);
      return x + "," + y;
    });
    var polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyline.setAttribute("points", pts.join(" "));
    polyline.setAttribute("fill", "none");
    polyline.setAttribute("stroke", couleur);
    polyline.setAttribute("stroke-width", "1.75");
    polyline.setAttribute("stroke-linecap", "round");
    polyline.setAttribute("stroke-linejoin", "round");
    svg.appendChild(polyline);
    return svg;
  }

  // Barres empilées : visiteurs (teinte forte) en bas, complément des vues (teinte claire) au-dessus
  function dessinerBarres(conteneur, serie) {
    conteneur.textContent = "";
    if (!serie || serie.length === 0) {
      conteneur.appendChild(elementVide("Pas encore assez de données pour tracer une tendance."));
      return;
    }

    var n = serie.length;
    // Toujours tenir dans la largeur de l'écran : pas de défilement
    // horizontal, les barres se resserrent plutôt que de déborder.
    var largeur = conteneur.clientWidth || 320;
    var pas = largeur / n;
    var epaisseur = Math.max(1.5, Math.min(22, pas * 0.62));
    var hauteur = 220;
    var marge = { haut: 20, bas: 26, gauche: 8, droite: 8 };
    var zoneH = hauteur - marge.haut - marge.bas;
    var zoneL = largeur - marge.gauche - marge.droite;

    var maxVal = 1;
    serie.forEach(function (j) { maxVal = Math.max(maxVal, j.views); });
    var echelle = Math.pow(10, Math.floor(Math.log10(maxVal)));
    var maxAxe = Math.ceil(maxVal / echelle) * echelle;
    if (maxAxe < maxVal) maxAxe += echelle;
    if (maxAxe === 0) maxAxe = 1;

    function xCentre(i) { return marge.gauche + (n === 1 ? zoneL / 2 : ((i + 0.5) / n) * zoneL); }
    function yDe(v) { return marge.haut + zoneH - (v / maxAxe) * zoneH; }

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "graphique");
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    svg.setAttribute("width", largeur);
    svg.setAttribute("height", hauteur);

    [0, 0.5, 1].forEach(function (f) {
      var y = marge.haut + zoneH * (1 - f);
      var ligne = document.createElementNS("http://www.w3.org/2000/svg", "line");
      ligne.setAttribute("x1", marge.gauche);
      ligne.setAttribute("x2", largeur - marge.droite);
      ligne.setAttribute("y1", y);
      ligne.setAttribute("y2", y);
      ligne.setAttribute("stroke", "var(--grid)");
      ligne.setAttribute("stroke-width", "1");
      svg.appendChild(ligne);

      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", marge.gauche + 2);
      label.setAttribute("y", y - 3);
      label.setAttribute("font-size", "9");
      label.setAttribute("font-family", "-apple-system, sans-serif");
      label.setAttribute("fill", "var(--ink-muted)");
      label.textContent = formatNombre(Math.round(maxAxe * f));
      svg.appendChild(label);
    });

    var baseline = marge.haut + zoneH;
    var rayon = Math.min(4, epaisseur / 2);

    serie.forEach(function (j, i) {
      var cx = xCentre(i);
      var x0 = cx - epaisseur / 2;
      var yVisiteurs = yDe(j.visitors);
      var yVues = yDe(j.views);

      if (j.visitors > 0) {
        svg.appendChild(barreArrondie(x0, yVisiteurs, epaisseur, baseline - yVisiteurs, rayon, "var(--series-visitors)"));
      }
      if (j.views > j.visitors) {
        svg.appendChild(barreArrondie(x0, yVues, epaisseur, yVisiteurs - yVues, rayon, "var(--series-views)"));
      } else if (j.views > 0 && j.visitors === 0) {
        svg.appendChild(barreArrondie(x0, yVues, epaisseur, baseline - yVues, rayon, "var(--series-views)"));
      } else if (j.views === 0 && j.visitors === 0) {
        // Marque explicitement les créneaux à zéro (plutôt qu'un vide qui
        // pourrait passer pour une donnée manquante).
        var zero = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        zero.setAttribute("x", x0);
        zero.setAttribute("y", baseline - 2);
        zero.setAttribute("width", epaisseur);
        zero.setAttribute("height", 2);
        zero.setAttribute("rx", 1);
        zero.setAttribute("fill", "var(--line-strong)");
        svg.appendChild(zero);
      }
    });

    var pasLabel = Math.max(1, Math.ceil(n / 6));
    serie.forEach(function (j, i) {
      if (i % pasLabel !== 0 && i !== n - 1) return;
      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", xCentre(i));
      label.setAttribute("y", hauteur - 7);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("font-size", "10");
      label.setAttribute("font-family", "-apple-system, sans-serif");
      label.setAttribute("fill", "var(--ink-muted)");
      label.textContent = etiquetteTemps(cleTemps(j));
      svg.appendChild(label);
    });

    function barreArrondie(x, y, w, h, r, couleur) {
      if (h <= 0) h = 0;
      r = Math.min(r, h);
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      var d = "M" + x + "," + (y + h) +
        " L" + x + "," + (y + r) +
        " Q" + x + "," + y + " " + (x + r) + "," + y +
        " L" + (x + w - r) + "," + y +
        " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
        " L" + (x + w) + "," + (y + h) + " Z";
      path.setAttribute("d", d);
      path.setAttribute("fill", couleur);
      return path;
    }

    var crosshair = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    crosshair.setAttribute("y", marge.haut);
    crosshair.setAttribute("width", pas);
    crosshair.setAttribute("height", zoneH);
    crosshair.setAttribute("fill", "var(--ink)");
    crosshair.style.opacity = "0";
    crosshair.setAttribute("fill-opacity", "0.06");
    svg.insertBefore(crosshair, svg.firstChild);

    var bulle = document.getElementById("bulle");

    function indexLePlusProche(mx) {
      var i = Math.floor(((mx - marge.gauche) / zoneL) * n);
      return Math.max(0, Math.min(n - 1, i));
    }

    function survol(evt) {
      var rectSvg = svg.getBoundingClientRect();
      var mx = ((evt.clientX - rectSvg.left) / rectSvg.width) * largeur;
      var i = indexLePlusProche(mx);
      var j = serie[i];
      var cx = xCentre(i);

      crosshair.setAttribute("x", cx - pas / 2);
      crosshair.style.opacity = "1";

      bulle.textContent = "";
      var titre = document.createElement("div");
      titre.className = "titre-bulle";
      titre.textContent = etiquetteTemps(cleTemps(j));
      bulle.appendChild(titre);
      [["Visiteurs", j.visitors, "var(--series-visitors)"], ["Vues", j.views, "var(--series-views)"]].forEach(function (row) {
        var l = document.createElement("div");
        l.className = "ligne";
        var cle = document.createElement("span");
        cle.className = "cle";
        cle.style.background = row[2];
        l.appendChild(cle);
        l.appendChild(document.createTextNode(row[0] + " "));
        var strong = document.createElement("strong");
        strong.textContent = row[1];
        l.appendChild(strong);
        bulle.appendChild(l);
      });

      var rectConteneur = conteneur.getBoundingClientRect();
      var xEcran = rectSvg.left - rectConteneur.left + (cx / largeur) * rectSvg.width;
      var decalage = xEcran < 70 ? 0 : (xEcran > conteneur.clientWidth - 70 ? -140 : -70);
      bulle.style.left = (xEcran + decalage) + "px";
      bulle.style.top = "4px";
      bulle.style.opacity = "1";
    }
    function quitter() {
      crosshair.style.opacity = "0";
      bulle.style.opacity = "0";
    }

    var zoneSurvol = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    zoneSurvol.setAttribute("x", 0);
    zoneSurvol.setAttribute("y", 0);
    zoneSurvol.setAttribute("width", largeur);
    zoneSurvol.setAttribute("height", hauteur);
    zoneSurvol.setAttribute("fill", "transparent");
    zoneSurvol.style.cursor = "crosshair";
    zoneSurvol.addEventListener("pointermove", survol);
    zoneSurvol.addEventListener("pointerenter", survol);
    zoneSurvol.addEventListener("pointerleave", quitter);
    svg.appendChild(zoneSurvol);

    conteneur.style.position = "relative";
    conteneur.appendChild(svg);
  }

  document.querySelectorAll(".plage button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".plage button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      etat.mode = b.dataset.mode;
      etat.valeur = Number(b.dataset.valeur);
      charger();
    });
  });

  charger();
  setInterval(charger, 60000);
})();
</script>
</body>
</html>
