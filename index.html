<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WebAnalyser — Nobook</title>
<style>
  /* Rendu calqué sur l'interface Umami réelle : tuiles avec badge plein,
     barres empilées (visiteurs + vues), listes classées avec pourcentage,
     mini-sparkline par site. */
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-visitors: #2a78d6;
    --series-views: #9ec5f4;
    --site-1: #2a78d6;
    --site-2: #eb6834;
    --site-3: #1baf7a;
    --good-bg: #e3f3e3;
    --good-fg: #006300;
    --bad-bg: #fbe7e5;
    --bad-fg: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-visitors: #3987e5;
      --series-views: #184f95;
      --site-1: #3987e5;
      --site-2: #d95926;
      --site-3: #199e70;
      --good-bg: #0f2a12;
      --good-fg: #3ddc3d;
      --bad-bg: #351413;
      --bad-fg: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-visitors: #3987e5;
    --series-views: #184f95;
    --site-1: #3987e5;
    --site-2: #d95926;
    --site-3: #199e70;
    --good-bg: #0f2a12;
    --good-fg: #3ddc3d;
    --bad-bg: #351413;
    --bad-fg: #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px;
    padding-block: 20px 48px;
    max-width: 1080px;
    margin-inline: auto;
  }

  .entete {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  h1 { font-size: 1.3rem; font-weight: 650; margin: 0 0 2px; text-wrap: balance; }
  .soustitre { color: var(--ink-2); font-size: 0.85rem; margin: 0; }

  .plage {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px;
    flex: none;
  }
  .plage button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .plage button:hover { background: var(--border); }
  .plage button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--page);
  }

  .onglets {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--grid);
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .onglets button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 14px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .onglets button[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--ink);
    font-weight: 650;
  }

  .maj { color: var(--ink-muted); font-size: 0.76rem; margin: -10px 0 14px; }

  .tuiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .tuile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .tuile .etiquette {
    color: var(--ink-2);
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tuile .etiquette .puce {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  .tuile .valeur {
    font-size: 1.9rem;
    font-weight: 650;
    margin-top: 2px;
  }
  .pastille {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.74rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    border-radius: 7px;
    margin-top: 8px;
  }
  .pastille.hausse { background: var(--good-bg); color: var(--good-fg); }
  .pastille.baisse { background: var(--bad-bg); color: var(--bad-fg); }

  .carte {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .carte h2 {
    font-size: 0.92rem;
    font-weight: 650;
    margin: 0 0 2px;
  }
  .carte .legende {
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
  }
  .legende .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-2);
  }
  .legende .puce-legende {
    width: 9px; height: 9px; border-radius: 2px; flex: none;
  }

  .zone-graphique { position: relative; overflow-x: auto; }
  svg.graphique { display: block; min-width: 100%; }
  .bulle {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    font-size: 0.76rem;
    padding: 8px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .bulle .titre-bulle { margin-bottom: 4px; opacity: 0.7; }
  .bulle strong { font-variant-numeric: tabular-nums; }
  .bulle .ligne { display: flex; align-items: center; gap: 6px; }
  .bulle .cle { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  .vide {
    color: var(--ink-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 36px 10px;
  }

  .onglets-souscarte {
    display: flex;
    gap: 14px;
    border-bottom: 1px solid var(--grid);
    margin-bottom: 10px;
  }
  .onglets-souscarte button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.78rem;
    font-weight: 500;
    padding: 0 0 8px;
    cursor: pointer;
    font-family: inherit;
    border-bottom: 2px solid transparent;
  }
  .onglets-souscarte button[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--series-visitors);
    font-weight: 650;
  }

  table.donnees {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.donnees th {
    text-align: left;
    color: var(--ink-muted);
    font-weight: 500;
    font-size: 0.76rem;
    padding: 0 8px 6px 0;
    border-bottom: 1px solid var(--grid);
  }
  table.donnees td {
    padding: 8px 8px 8px 0;
    border-bottom: 1px solid var(--grid);
    color: var(--ink);
  }
  table.donnees tr:last-child td { border-bottom: none; }
  table.donnees td.chemin {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  table.donnees td.chiffres {
    text-align: right;
    width: 90px;
  }
  table.donnees .nombre {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  table.donnees .pourcentage {
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    font-size: 0.76rem;
    margin-left: 6px;
  }

  .deux-colonnes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .deux-colonnes { grid-template-columns: 1fr; }
    .entete { flex-direction: column; }
  }

  .apercu-site {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 10px 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--grid);
  }
  .apercu-site:last-child { border-bottom: none; }
  .apercu-site .nom {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 0.9rem;
  }
  .apercu-site .nom .puce { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .apercu-site .sparkline { flex: none; }
  .apercu-site .chiffre {
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-size: 0.9rem;
  }
  .apercu-site .chiffre .petit {
    display: block;
    font-size: 0.68rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
  @media (max-width: 480px) {
    .apercu-site { grid-template-columns: 1fr auto; row-gap: 6px; }
    .apercu-site .sparkline { display: none; }
  }
</style>
</head>
<body>

<div class="entete">
  <div>
    <h1>WebAnalyser</h1>
    <p class="soustitre">Vues et visiteurs uniques de tes sites, en direct depuis le projet Supabase Nobook.</p>
  </div>
  <div class="plage" role="group" aria-label="Période">
    <button data-jours="7">7 jours</button>
    <button data-jours="30" aria-pressed="true">30 jours</button>
    <button data-jours="90">90 jours</button>
  </div>
</div>

<div class="onglets" id="onglets" role="tablist"></div>
<p class="maj" id="maj"></p>
<div id="contenu"></div>
<div class="bulle" id="bulle"></div>

<script>
(function () {
  var FONCTION = "https://pjudywzdrixhddemhhub.supabase.co/functions/v1/stats";
  var NOMS = { "riad-sasha": "Riad Sasha", "riadsoulmate": "Riad Soulmate", "chezmamiejo": "Chez Mamie Jo" };
  var ORDRE_COULEURS = ["riad-sasha", "chezmamiejo", "riadsoulmate"];

  var etat = { jours: 30, actuel: null, precedent: null, septJours: null, ongletActif: "tous", sousOnglet: "referrers" };

  function couleurSite(siteId) {
    var i = ORDRE_COULEURS.indexOf(siteId);
    if (i === -1) i = (ORDRE_COULEURS.length + Math.abs(hash(siteId)) % 5);
    var slots = ["--site-1", "--site-2", "--site-3"];
    return "var(" + (slots[i] || "--site-1") + ")";
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i);
    return h;
  }
  function nomSite(id) { return NOMS[id] || id; }

  function formatNombre(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
  }
  function formatJour(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  async function charger() {
    try {
      var [r1, r2, r3] = await Promise.all([
        fetch(FONCTION + "?days=" + etat.jours),
        fetch(FONCTION + "?days=" + (etat.jours * 2)),
        fetch(FONCTION + "?days=7")
      ]);
      var actuel = await r1.json();
      var double = await r2.json();
      etat.actuel = actuel;
      etat.septJours = await r3.json();
      var precedent = { sites: {} };
      Object.keys(double.sites || {}).forEach(function (id) {
        var tot = double.sites[id];
        var cur = (actuel.sites && actuel.sites[id]) || { views: 0, visitors: 0 };
        precedent.sites[id] = {
          views: Math.max(0, tot.views - cur.views),
          visitors: Math.max(0, tot.visitors - cur.visitors)
        };
      });
      etat.precedent = precedent;
    } catch (e) {
      etat.actuel = { erreur: true };
    }
    construireOnglets();
    rendre();
  }

  function listeSites() {
    if (!etat.actuel || !etat.actuel.sites) return [];
    return Object.keys(etat.actuel.sites).sort(function (a, b) {
      return etat.actuel.sites[b].views - etat.actuel.sites[a].views;
    });
  }

  function construireOnglets() {
    var conteneur = document.getElementById("onglets");
    conteneur.textContent = "";
    var sites = listeSites();

    var btnTous = document.createElement("button");
    btnTous.textContent = "Tous les sites";
    btnTous.setAttribute("role", "tab");
    btnTous.addEventListener("click", function () { etat.ongletActif = "tous"; rendre(); });
    conteneur.appendChild(btnTous);

    sites.forEach(function (id) {
      var b = document.createElement("button");
      b.textContent = nomSite(id);
      b.setAttribute("role", "tab");
      b.addEventListener("click", function () { etat.ongletActif = id; rendre(); });
      conteneur.appendChild(b);
    });

    Array.prototype.forEach.call(conteneur.children, function (b, idx) {
      var estActif = (idx === 0 && etat.ongletActif === "tous") || b.textContent === nomSite(etat.ongletActif);
      b.setAttribute("aria-selected", String(estActif));
    });
  }

  function rendre() {
    var contenu = document.getElementById("contenu");
    var majEl = document.getElementById("maj");
    contenu.textContent = "";

    if (!etat.actuel || etat.actuel.erreur) {
      contenu.appendChild(elementVide("Impossible de charger les statistiques pour le moment."));
      return;
    }

    if (etat.actuel.generated_at) {
      var d = new Date(etat.actuel.generated_at);
      majEl.textContent = "Mis à jour à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    if (etat.ongletActif === "tous") {
      rendreApercuGlobal(contenu);
    } else {
      rendreSite(contenu, etat.ongletActif);
    }
  }

  function totaux(bloc) {
    var sites = (bloc && bloc.sites) || {};
    var v = 0, u = 0;
    Object.keys(sites).forEach(function (id) { v += sites[id].views || 0; u += sites[id].visitors || 0; });
    return { views: v, visitors: u };
  }

  function joursCombines(bloc) {
    var sites = (bloc && bloc.sites) || {};
    var parJour = {};
    Object.keys(sites).forEach(function (id) {
      (sites[id].by_day || []).forEach(function (j) {
        if (!parJour[j.day]) parJour[j.day] = { day: j.day, views: 0, visitors: 0 };
        parJour[j.day].views += j.views;
        parJour[j.day].visitors += j.visitors;
      });
    });
    return Object.keys(parJour).sort().map(function (k) { return parJour[k]; });
  }

  function pastilleTendance(actuelV, precedentV) {
    if (!precedentV) return null;
    var variation = ((actuelV - precedentV) / precedentV) * 100;
    var hausse = variation >= 0;
    var p = document.createElement("span");
    p.className = "pastille " + (hausse ? "hausse" : "baisse");
    p.appendChild(document.createTextNode((hausse ? "▲ " : "▼ ") + Math.abs(Math.round(variation)) + "%"));
    return p;
  }

  function rendreApercuGlobal(contenu) {
    var sites = listeSites();
    var totActuel = totaux(etat.actuel);
    var totPrecedent = totaux(etat.precedent);

    var tuiles = document.createElement("div");
    tuiles.className = "tuiles";
    tuiles.appendChild(tuile("Visiteurs uniques", totActuel.visitors, totPrecedent.visitors, "var(--series-visitors)"));
    tuiles.appendChild(tuile("Vues", totActuel.views, totPrecedent.views, "var(--series-views)"));
    contenu.appendChild(tuiles);

    if (sites.length > 0) {
      var carteGraph = document.createElement("div");
      carteGraph.className = "carte";
      carteGraph.appendChild(enteteGraphique());
      var zoneGraph = document.createElement("div");
      zoneGraph.className = "zone-graphique";
      carteGraph.appendChild(zoneGraph);
      contenu.appendChild(carteGraph);
      dessinerBarres(zoneGraph, joursCombines(etat.actuel));
    }

    var carte = document.createElement("div");
    carte.className = "carte";
    var h2 = document.createElement("h2");
    h2.textContent = "Par site";
    carte.appendChild(h2);

    if (sites.length === 0) {
      carte.appendChild(elementVide("Pas encore de visite enregistrée sur cette période."));
    } else {
      var septSites = (etat.septJours && etat.septJours.sites) || {};
      sites.forEach(function (id) {
        var s = etat.actuel.sites[id];
        var ligne = document.createElement("div");
        ligne.className = "apercu-site";

        var nom = document.createElement("div");
        nom.className = "nom";
        var puce = document.createElement("span");
        puce.className = "puce";
        puce.style.background = couleurSite(id);
        nom.appendChild(puce);
        nom.appendChild(document.createTextNode(nomSite(id)));
        ligne.appendChild(nom);

        var spark = document.createElement("span");
        spark.className = "sparkline";
        var joursSept = (septSites[id] && septSites[id].by_day) || [];
        spark.appendChild(dessinerSparkline(joursSept, couleurSite(id)));
        ligne.appendChild(spark);

        var visiteurs = document.createElement("div");
        visiteurs.className = "chiffre";
        var uVal = document.createElement("span"); uVal.textContent = formatNombre(s.visitors);
        var uLbl = document.createElement("span"); uLbl.className = "petit"; uLbl.textContent = "visiteurs";
        visiteurs.appendChild(uVal); visiteurs.appendChild(uLbl);
        ligne.appendChild(visiteurs);

        var vues = document.createElement("div");
        vues.className = "chiffre";
        var vVal = document.createElement("span"); vVal.textContent = formatNombre(s.views);
        var vLbl = document.createElement("span"); vLbl.className = "petit"; vLbl.textContent = "vues";
        vues.appendChild(vVal); vues.appendChild(vLbl);
        ligne.appendChild(vues);

        carte.appendChild(ligne);
      });
    }
    contenu.appendChild(carte);
  }

  function rendreSite(contenu, id) {
    var s = etat.actuel.sites[id];
    var sPrec = (etat.precedent.sites && etat.precedent.sites[id]) || { views: 0, visitors: 0 };
    if (!s) {
      contenu.appendChild(elementVide("Pas encore de visite enregistrée pour " + nomSite(id) + " sur cette période."));
      return;
    }

    var tuiles = document.createElement("div");
    tuiles.className = "tuiles";
    tuiles.appendChild(tuile("Visiteurs uniques", s.visitors, sPrec.visitors, "var(--series-visitors)"));
    tuiles.appendChild(tuile("Vues", s.views, sPrec.views, "var(--series-views)"));
    contenu.appendChild(tuiles);

    var carteGraph = document.createElement("div");
    carteGraph.className = "carte";
    carteGraph.appendChild(enteteGraphique());
    var zoneGraph = document.createElement("div");
    zoneGraph.className = "zone-graphique";
    carteGraph.appendChild(zoneGraph);
    contenu.appendChild(carteGraph);
    dessinerBarres(zoneGraph, s.by_day);

    var carteListes = document.createElement("div");
    carteListes.className = "carte";
    var ongletsSous = document.createElement("div");
    ongletsSous.className = "onglets-souscarte";
    var btnPages = document.createElement("button"); btnPages.textContent = "Pages"; btnPages.setAttribute("role", "tab");
    var btnRef = document.createElement("button"); btnRef.textContent = "Référents"; btnRef.setAttribute("role", "tab");
    btnPages.addEventListener("click", function () { etat.sousOnglet = "pages"; rendre(); });
    btnRef.addEventListener("click", function () { etat.sousOnglet = "referrers"; rendre(); });
    btnPages.setAttribute("aria-selected", String(etat.sousOnglet === "pages"));
    btnRef.setAttribute("aria-selected", String(etat.sousOnglet === "referrers"));
    ongletsSous.appendChild(btnPages);
    ongletsSous.appendChild(btnRef);
    carteListes.appendChild(ongletsSous);

    if (etat.sousOnglet === "pages") {
      carteListes.appendChild(tableauDonnees(s.top_pages, "path", "Page", s.views));
    } else {
      carteListes.appendChild(tableauDonnees(s.top_referrers, "referrer", "Source", s.views));
    }
    contenu.appendChild(carteListes);
  }

  function enteteGraphique() {
    var frag = document.createDocumentFragment();
    var h2 = document.createElement("h2"); h2.textContent = "Tendance";
    var legende = document.createElement("div");
    legende.className = "legende";
    [["Visiteurs", "var(--series-visitors)"], ["Vues", "var(--series-views)"]].forEach(function (p) {
      var item = document.createElement("span"); item.className = "item";
      var puce = document.createElement("span"); puce.className = "puce-legende"; puce.style.background = p[1];
      item.appendChild(puce);
      item.appendChild(document.createTextNode(p[0]));
      legende.appendChild(item);
    });
    frag.appendChild(h2);
    frag.appendChild(legende);
    return frag;
  }

  function tuile(label, valeurActuelle, valeurPrecedente, couleur) {
    var d = document.createElement("div");
    d.className = "tuile";
    var e = document.createElement("div");
    e.className = "etiquette";
    var puce = document.createElement("span");
    puce.className = "puce";
    puce.style.background = couleur;
    e.appendChild(puce);
    e.appendChild(document.createTextNode(label));
    d.appendChild(e);

    var v = document.createElement("div");
    v.className = "valeur";
    v.textContent = formatNombre(valeurActuelle);
    d.appendChild(v);

    var badge = pastilleTendance(valeurActuelle, valeurPrecedente);
    if (badge) d.appendChild(badge);

    return d;
  }

  function elementVide(texte) {
    var p = document.createElement("p");
    p.className = "vide";
    p.textContent = texte;
    return p;
  }

  function tableauDonnees(lignes, cle, entete, totalVues) {
    if (!lignes || lignes.length === 0) {
      return elementVide("Rien à afficher pour l'instant.");
    }
    var table = document.createElement("table");
    table.className = "donnees";
    var thead = document.createElement("thead");
    var trh = document.createElement("tr");
    var thNom = document.createElement("th"); thNom.textContent = entete;
    var thVal = document.createElement("th"); thVal.textContent = "Vues"; thVal.style.textAlign = "right";
    trh.appendChild(thNom); trh.appendChild(thVal);
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    lignes.forEach(function (ligne) {
      var tr = document.createElement("tr");
      var tdNom = document.createElement("td");
      tdNom.className = "chemin";
      tdNom.textContent = ligne[cle] || "/";
      tdNom.title = ligne[cle] || "";
      var tdVal = document.createElement("td");
      tdVal.className = "chiffres";
      var nb = document.createElement("span"); nb.className = "nombre"; nb.textContent = formatNombre(ligne.views);
      tdVal.appendChild(nb);
      if (totalVues > 0) {
        var pct = document.createElement("span");
        pct.className = "pourcentage";
        pct.textContent = Math.round((ligne.views / totalVues) * 100) + "%";
        tdVal.appendChild(pct);
      }
      tr.appendChild(tdNom); tr.appendChild(tdVal);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function dessinerSparkline(jours, couleur) {
    var largeur = 64, hauteur = 24;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", largeur);
    svg.setAttribute("height", hauteur);
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    if (!jours || jours.length < 2) return svg;
    var max = 1;
    jours.forEach(function (j) { max = Math.max(max, j.views); });
    var n = jours.length;
    var pts = jours.map(function (j, i) {
      var x = (i / (n - 1)) * (largeur - 4) + 2;
      var y = hauteur - 3 - (j.views / max) * (hauteur - 6);
      return x + "," + y;
    });
    var polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyline.setAttribute("points", pts.join(" "));
    polyline.setAttribute("fill", "none");
    polyline.setAttribute("stroke", couleur);
    polyline.setAttribute("stroke-width", "1.5");
    polyline.setAttribute("stroke-linecap", "round");
    polyline.setAttribute("stroke-linejoin", "round");
    svg.appendChild(polyline);
    return svg;
  }

  // Barres empilées : visiteurs (teinte forte) en bas, complément des vues (teinte claire) au-dessus
  function dessinerBarres(conteneur, jours) {
    conteneur.textContent = "";
    if (!jours || jours.length === 0) {
      conteneur.appendChild(elementVide("Pas encore assez de données pour tracer une tendance."));
      return;
    }

    var n = jours.length;
    var epaisseur = n <= 14 ? 22 : (n <= 30 ? 12 : 5);
    var pas = Math.max(epaisseur + 6, epaisseur * 1.7);
    var largeur = Math.max(560, n * pas);
    var hauteur = 220;
    var marge = { haut: 20, bas: 26, gauche: 8, droite: 8 };
    var zoneH = hauteur - marge.haut - marge.bas;
    var zoneL = largeur - marge.gauche - marge.droite;

    var maxVal = 1;
    jours.forEach(function (j) { maxVal = Math.max(maxVal, j.views); });
    var echelle = Math.pow(10, Math.floor(Math.log10(maxVal)));
    var maxAxe = Math.ceil(maxVal / echelle) * echelle;
    if (maxAxe < maxVal) maxAxe += echelle;
    if (maxAxe === 0) maxAxe = 1;

    function xCentre(i) { return marge.gauche + (n === 1 ? zoneL / 2 : ((i + 0.5) / n) * zoneL); }
    function yDe(v) { return marge.haut + zoneH - (v / maxAxe) * zoneH; }

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "graphique");
    svg.setAttribute("viewBox", "0 0 " + largeur + " " + hauteur);
    svg.setAttribute("width", largeur);
    svg.setAttribute("height", hauteur);

    [0, 0.5, 1].forEach(function (f) {
      var y = marge.haut + zoneH * (1 - f);
      var ligne = document.createElementNS("http://www.w3.org/2000/svg", "line");
      ligne.setAttribute("x1", marge.gauche);
      ligne.setAttribute("x2", largeur - marge.droite);
      ligne.setAttribute("y1", y);
      ligne.setAttribute("y2", y);
      ligne.setAttribute("stroke", "var(--grid)");
      ligne.setAttribute("stroke-width", "1");
      svg.appendChild(ligne);

      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", marge.gauche + 2);
      label.setAttribute("y", y - 3);
      label.setAttribute("font-size", "9");
      label.setAttribute("fill", "var(--ink-muted)");
      label.textContent = formatNombre(Math.round(maxAxe * f));
      svg.appendChild(label);
    });

    var baseline = marge.haut + zoneH;
    var rayon = Math.min(4, epaisseur / 2);

    jours.forEach(function (j, i) {
      var cx = xCentre(i);
      var x0 = cx - epaisseur / 2;
      var yVisiteurs = yDe(j.visitors);
      var yVues = yDe(j.views);

      if (j.visitors > 0) {
        svg.appendChild(barreArrondie(x0, yVisiteurs, epaisseur, baseline - yVisiteurs, rayon, "var(--series-visitors)"));
      }
      if (j.views > j.visitors) {
        svg.appendChild(barreArrondie(x0, yVues, epaisseur, yVisiteurs - yVues, rayon, "var(--series-views)"));
      } else if (j.views > 0 && j.visitors === 0) {
        // cas limite : vues sans visiteurs comptés (ne devrait pas arriver, sécurité d'affichage)
        svg.appendChild(barreArrondie(x0, yVues, epaisseur, baseline - yVues, rayon, "var(--series-views)"));
      }
    });

    var pasLabel = Math.max(1, Math.ceil(n / 6));
    jours.forEach(function (j, i) {
      if (i % pasLabel !== 0 && i !== n - 1) return;
      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", xCentre(i));
      label.setAttribute("y", hauteur - 7);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("font-size", "10");
      label.setAttribute("fill", "var(--ink-muted)");
      label.textContent = formatJour(j.day);
      svg.appendChild(label);
    });

    function barreArrondie(x, y, w, h, r, couleur) {
      if (h <= 0) h = 0;
      r = Math.min(r, h);
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      var d = "M" + x + "," + (y + h) +
        " L" + x + "," + (y + r) +
        " Q" + x + "," + y + " " + (x + r) + "," + y +
        " L" + (x + w - r) + "," + y +
        " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
        " L" + (x + w) + "," + (y + h) + " Z";
      path.setAttribute("d", d);
      path.setAttribute("fill", couleur);
      return path;
    }

    // survol : repère vertical qui s'accroche au jour le plus proche
    var crosshair = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    crosshair.setAttribute("y", marge.haut);
    crosshair.setAttribute("width", pas);
    crosshair.setAttribute("height", zoneH);
    crosshair.setAttribute("fill", "var(--ink)");
    crosshair.style.opacity = "0";
    crosshair.setAttribute("fill-opacity", "0.06");
    svg.insertBefore(crosshair, svg.firstChild);

    var bulle = document.getElementById("bulle");

    function indexLePlusProche(mx) {
      var i = Math.floor(((mx - marge.gauche) / zoneL) * n);
      return Math.max(0, Math.min(n - 1, i));
    }

    function survol(evt) {
      var rectSvg = svg.getBoundingClientRect();
      var mx = ((evt.clientX - rectSvg.left) / rectSvg.width) * largeur;
      var i = indexLePlusProche(mx);
      var j = jours[i];
      var cx = xCentre(i);

      crosshair.setAttribute("x", cx - pas / 2);
      crosshair.style.opacity = "1";

      bulle.textContent = "";
      var titre = document.createElement("div");
      titre.className = "titre-bulle";
      titre.textContent = formatJour(j.day);
      bulle.appendChild(titre);
      [["Visiteurs", j.visitors, "var(--series-visitors)"], ["Vues", j.views, "var(--series-views)"]].forEach(function (row) {
        var l = document.createElement("div");
        l.className = "ligne";
        var cle = document.createElement("span");
        cle.className = "cle";
        cle.style.background = row[2];
        l.appendChild(cle);
        l.appendChild(document.createTextNode(row[0] + " "));
        var strong = document.createElement("strong");
        strong.textContent = row[1];
        l.appendChild(strong);
        bulle.appendChild(l);
      });

      var rectConteneur = conteneur.getBoundingClientRect();
      var xEcran = rectSvg.left - rectConteneur.left + (cx / largeur) * rectSvg.width;
      var decalage = xEcran < 70 ? 0 : (xEcran > conteneur.clientWidth - 70 ? -140 : -70);
      bulle.style.left = (xEcran + decalage) + "px";
      bulle.style.top = "4px";
      bulle.style.opacity = "1";
    }
    function quitter() {
      crosshair.style.opacity = "0";
      bulle.style.opacity = "0";
    }

    var zoneSurvol = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    zoneSurvol.setAttribute("x", 0);
    zoneSurvol.setAttribute("y", 0);
    zoneSurvol.setAttribute("width", largeur);
    zoneSurvol.setAttribute("height", hauteur);
    zoneSurvol.setAttribute("fill", "transparent");
    zoneSurvol.style.cursor = "crosshair";
    zoneSurvol.addEventListener("pointermove", survol);
    zoneSurvol.addEventListener("pointerenter", survol);
    zoneSurvol.addEventListener("pointerleave", quitter);
    svg.appendChild(zoneSurvol);

    conteneur.style.position = "relative";
    conteneur.appendChild(svg);
  }

  document.querySelectorAll(".plage button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".plage button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      etat.jours = Number(b.dataset.jours);
      charger();
    });
  });

  charger();
  setInterval(charger, 60000);
})();
</script>
</body>
</html>
